# RiverGuard - the full stack. Start:  docker compose up -d
# Everything below assumes this file's services form one Docker network
# (compose creates it automatically) - services reach each other by name.

networks:
  riverguard:
    name: riverguard-docker-network

services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: riverguard-eclipse
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/conf:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks: [riverguard]

  mongo:
    image: mongo:7.0
    container_name: riverguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/data:/data/db
    networks: [riverguard]
    

  redis:
    image: redis:alpine
    container_name: riverguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [riverguard]
    # no volume: pub/sub only, nothing persists

  parser:
    build: ./parser
    container_name: riverguard-parser
    restart: unless-stopped
    env_file: parser/.env.docker
    volumes:
      - ./parser/logs:/app/logs
    depends_on:
      - mosquitto
      - mongo
      - redis
    networks: [riverguard]

  api:
    build: ./api
    container_name: riverguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"           # website + API: http://localhost:8000
    env_file: api/.env.docker
    volumes:
      - ./api/logs:/app/logs
    depends_on:
      - mongo
      - redis
    networks: [riverguard]