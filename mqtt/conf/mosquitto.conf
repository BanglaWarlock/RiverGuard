# RiverGuard local broker configuration

# Listen on all interfaces, standard port (inside the container).
listener 1883 0.0.0.0

# No authentication for connection.
allow_anonymous true

# Persistence: save broker state (retained messages, queues) so it
# survives container restarts. Written to /mosquitto/data.
persistence true
persistence_location /mosquitto/data/

# Logging: connection events and errors to both the log file and
# docker logs (the container's stdout).
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true