<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiverGuard — Network Monitoring</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="brand">RiverGuard <span class="tag">network monitoring</span></div>
    <nav class="tabs">
      <button type="button" class="tab active" data-tab="network">Network</button>
      <button type="button" class="tab" data-tab="map">Map</button>
      <button type="button" class="tab" data-tab="flood">Flood Edit</button>
      <button type="button" class="tab" data-tab="stream">Stream</button>
    </nav>
    <div class="header-right">
      <span class="stats-line" id="stats-line"></span>
      <button type="button" id="theme-btn" title="Toggle light/dark">◐</button>
      <button type="button" id="refresh-btn" title="Reload all data">⟳</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: network graph -->
    <section id="tab-network" class="tab-panel active">
      <div id="graph-canvas"></div>
      <div id="blacklist-panel">
        <h2>Link policy</h2>
        <div id="blacklist-current"></div>
        <h2>History</h2>
        <div id="blacklist-history"></div>
      </div>
      <aside id="side-card">
        <div class="side-tabs">
          <button type="button" class="side-tab active" data-side="network">Network</button>
          <button type="button" class="side-tab" data-side="flood">Flood</button>
        </div>
        <div id="side-content"></div>
      </aside>
    </section>

    <!-- TAB 2: map -->
    <section id="tab-map" class="tab-panel">
      <div id="map"></div>
      <div id="map-empty" class="empty-note">
        Nodes will appear on the map once GPS positions are available
        (set manually in the side card, or reported by hardware).
      </div>
    </section>

    <!-- TAB 3: flood edit -->
    <section id="tab-flood" class="tab-panel">
      <div class="flood-edit">
        <h2>Flood levels (local demo data)</h2>
        <p class="note">Stored in this browser only. Levels are continuous
          and grouped into classes for display.</p>
        <div id="flood-list"></div>
      </div>
    </section>

    <!-- TAB 4: stream -->
    <section id="tab-stream" class="tab-panel">
      <div class="stream-view">
        <div class="stream-controls">
        </div>
        <div id="stream-feed"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/flood.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/streamtab.js"></script>
  <script src="js/stream.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blacklistpanel.js"></script>
</body>

</html>
